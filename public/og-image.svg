<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Glowing Accent Circle -->
  <circle cx="1050" cy="150" r="160" fill="#0d9488" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="500" r="120" fill="#0284c7" opacity="0.1" filter="url(#glow)" />

  <!-- App Logo / Badge -->
  <g transform="translate(100, 90)">
    <rect width="72" height="72" rx="16" fill="#0d9488" />
    <!-- Rupee Icon -->
    <path d="M22 20h28M22 28h24M22 20v32M29 28c7 0 12 3.5 12 9s-5 9-12 9l16 14" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="195" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Bill<tspan fill="#14b8a6">Flow</tspan>
  </text>
  <text x="360" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">
    — Smart Billing for India
  </text>

  <!-- Main Headline -->
  <text x="100" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    GST-Compliant Smart Invoicing
  </text>
  <text x="100" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#2dd4bf" letter-spacing="-0.5">
    &amp; Real-Time Business Accounting
  </text>

  <!-- Description paragraph -->
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Create professional GST invoices, track payments, manage 360+ inventory items,
  </text>
  <text x="100" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    and generate Excel Tax Invoices &amp; instant PDF receipts for Indian MSMEs.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="23" r="6" fill="#14b8a6" />
    <text x="40" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      CGST / SGST / IGST
    </text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="230" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="259" cy="23" r="6" fill="#14b8a6" />
    <text x="275" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      Excel &amp; PDF Invoices
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="240" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="504" cy="23" r="6" fill="#14b8a6" />
    <text x="520" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      Live Stock &amp; Ledger
    </text>

    <!-- Pill 4 -->
    <rect x="735" y="0" width="230" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="759" cy="23" r="6" fill="#14b8a6" />
    <text x="775" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      UPI &amp; Bank Gateway
    </text>
  </g>

  <!-- Bottom Bar Badge -->
  <g transform="translate(100, 560)">
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b">
      🔒 100% Client-Side Privacy • DPDP &amp; GST Rule Compliant • Fast &amp; Offline Ready
    </text>
  </g>
</svg>
